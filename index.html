<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f4"><link rel="manifest" href="manifest.webmanifest"><title>買いもの日和</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#26332d;background:#f6f7f4;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{padding:20px 18px 12px;background:var(--panel,#fff);position:sticky;top:0;z-index:2;box-shadow:0 2px 10px #00000008}.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}.sub{color:#7b8980;font-size:12px}.toolbar{display:flex;gap:8px;margin-top:14px}select,.secondary{border:1px solid #dce4dc;border-radius:12px;background:white;padding:10px;min-width:0}.toolbar select{flex:1}.secondary{font-size:14px}main{padding:14px 14px 115px;max-width:700px;margin:auto}.category{margin:12px 0 18px;background:var(--panel,#fff);border-radius:17px;overflow:hidden;box-shadow:0 3px 16px #00000008}.cathead{padding:13px 15px;display:flex;justify-content:space-between;font-weight:700;background:var(--tint,#e9f2eb);cursor:pointer}.item{display:flex;align-items:center;gap:10px;padding:13px 12px;border-top:1px solid #eef0ed}.item input[type=checkbox]{width:23px;height:23px;accent-color:#438c66}.item .name{flex:1;text-align:left;border:0;background:none;padding:5px 0;color:inherit}.item .star{border:0;background:none;font-size:23px;color:#d1d6ce}.item .star.on{color:#efb640}.qty{font-size:13px;color:#75847b}.purchased .name{opacity:.45;text-decoration:line-through}.purchased{opacity:.7}.floating{position:fixed;right:22px;bottom:26px;border:0;border-radius:50%;width:60px;height:60px;background:#438c66;color:white;font-size:34px;box-shadow:0 5px 22px #35694955;z-index:3}.finish{margin:16px auto;display:block;border:1px solid #cbd9cd;background:#fff;border-radius:12px;padding:12px 18px}.empty{padding:45px 15px;text-align:center;color:#89948b}.overlay{position:fixed;inset:0;background:#0007;z-index:5;display:none;align-items:end}.overlay.open{display:flex}.sheet{background:var(--panel,#fff);border-radius:24px 24px 0 0;width:100%;max-height:88dvh;overflow:auto;padding:14px 20px 32px;box-shadow:0 -8px 35px #0002}.handle{width:44px;height:5px;background:#d5dcd6;border-radius:10px;margin:0 auto 15px}.sheet h2{margin:4px 0 16px;font-size:20px}.field{display:block;margin:11px 0 5px;font-size:13px;color:#637269}.fieldinput{width:100%;border:1px solid #dbe2dc;border-radius:12px;padding:12px;background:#fff;color:#26332d}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.primary{background:#438c66;border:0;color:white;border-radius:13px;padding:13px 18px;font-weight:700}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}.pill{border:1px solid #dce6dd;background:#f5f9f5;border-radius:99px;padding:8px 11px;font-size:13px}.checkrow{display:flex;flex-wrap:wrap;gap:9px}.checkrow label{padding:7px 10px;border-radius:10px;background:#f1f5f1;font-size:13px}.tiny{color:#859087;font-size:12px}.settingline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}.settingline input{width:60%}#message{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#26332d;color:#fff;border-radius:20px;padding:9px 16px;display:none;z-index:9;white-space:nowrap;font-size:13px}body[data-theme=2]{--panel:#fffaff;--tint:#fae9f3;background:#fff3fa;color:#513c4d}body[data-theme=3]{--panel:#242b31;--tint:#343e45;background:#171e23;color:#f3f4f3}body[data-theme=3] header,body[data-theme=3] .category{color:#f3f4f3}body[data-theme=3] .fieldinput,body[data-theme=3] select,body[data-theme=3] .secondary{background:#343e45;color:white;border-color:#58636a}body[data-theme=4]{--panel:#fff;--tint:#fff0c9;background:#f8f5e9;color:#3b352d}
</style></head><body><header><div class="top"><div><h1>☀️ 買いもの日和</h1><div class="sub">いつもの買い物を、もっと軽やかに。</div></div><button class="secondary" onclick="openSettings()">⚙️ 設定</button></div><div class="toolbar"><select id="storeFilter" onchange="changeStore(this.value)"></select><button class="secondary" onclick="openStores()">お店管理</button></div></header><main id="main"></main><button class="floating" aria-label="商品を追加" onclick="openAdd()">＋</button><div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div><div id="message"></div><script>
const KEY='kaimono-biyori-v1';const defaults={items:[],history:{},stores:[],categories:['野菜','果物','肉・魚','乳製品・卵','パン・麺・米','冷凍食品','調味料','日用品','その他'],orders:{},collapsed:[],lastStore:'all',theme:'1',font:16};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(defaults)};let currentEdit=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function toast(t){$('message').textContent=t;$('message').style.display='block';setTimeout(()=>$('message').style.display='none',1700)}function orderedCats(){let a=state.orders[state.lastStore]||[];return [...new Set([...a,...state.categories])].filter(c=>state.categories.includes(c))}function visibleItems(){return state.items.filter(i=>state.lastStore==='all'||!i.stores.length||i.stores.includes(state.lastStore))}function render(){document.body.dataset.theme=state.theme;document.documentElement.style.fontSize=state.font+'px';$('storeFilter').innerHTML='<option value="all">すべてのお店</option>'+state.stores.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');if(state.lastStore!=='all'&&!state.stores.some(s=>s.id===state.lastStore))state.lastStore='all';$('storeFilter').value=state.lastStore;let items=visibleItems(),active=items.filter(i=>!i.done),done=items.filter(i=>i.done);let html='';for(let c of orderedCats()){let group=active.filter(i=>i.category===c);if(!group.length)continue;let collapsed=state.collapsed.includes(c);html+=`<section class="category"><div class="cathead" onclick="toggleCat('${encodeURIComponent(c)}')"><span>${esc(c)} <small>(${group.length})</small></span><span>${collapsed?'＋':'⌄'}</span></div>${collapsed?'':group.map(itemHTML).join('')}</section>`}if(done.length)html+=`<section class="category"><div class="cathead">購入済み (${done.length})</div>${done.map(itemHTML).join('')}</section>`;if(!items.length)html='<div class="empty">まだ商品がありません。<br>右下の＋から追加してね 🛒</div>';html+='<button class="finish" onclick="finish()">✓ 買い物終了</button>';$('main').innerHTML=html}function itemHTML(i){return `<div class="item ${i.done?'purchased':''}"><input type="checkbox" ${i.done?'checked':''} onchange="toggleDone('${i.id}')"><button class="name" onclick="openEdit('${i.id}')">${esc(i.name)} <span class="qty">${i.qty>1?'× '+i.qty:''}</span></button><button class="star ${state.history[i.name]?.fav?'on':''}" onclick="toggleFav('${i.id}')">${state.history[i.name]?.fav?'★':'☆'}</button><button class="secondary" style="padding:6px" onclick="deleteItem('${i.id}')" aria-label="削除">⌫</button></div>`}function changeStore(id){state.lastStore=id;save()}function toggleCat(s){let c=decodeURIComponent(s);state.collapsed=state.collapsed.includes(c)?state.collapsed.filter(x=>x!==c):[...state.collapsed,c];save()}function toggleDone(id){let i=state.items.find(x=>x.id===id);if(i){i.done=!i.done;save()}}function toggleFav(id){let i=state.items.find(x=>x.id===id);if(!i)return;state.history[i.name]??={count:0,fav:false};state.history[i.name].fav=!state.history[i.name].fav;save()}function deleteItem(id){if(confirm('この商品を削除しますか？')){state.items=state.items.filter(i=>i.id!==id);save()}}function finish(){let n=state.items.filter(i=>i.done).length;if(!n){toast('購入済みの商品はありません');return}if(confirm(`購入済みの${n}商品をリストから削除しますか？\n未購入の商品やお気に入りは残ります。`)){state.items=state.items.filter(i=>!i.done);save()}}function openSheet(html){$('sheet').innerHTML='<div class="handle"></div>'+html;$('overlay').classList.add('open')}function closeSheet(){$('overlay').classList.remove('open');currentEdit=null}let selectedStores=[];function storeChecks(ids=[]){return state.stores.map(s=>`<label><input type="checkbox" data-store="${s.id}" ${ids.includes(s.id)?'checked':''}> ${esc(s.name)}</label>`).join('')||'<span class="tiny">お店未登録（どのお店にも表示されます）</span>'}function getSelectedStores(){return [...$('sheet').querySelectorAll('[data-store]:checked')].map(x=>x.dataset.store)}function categorySelect(v){return `<select id="itemCategory" class="fieldinput">${state.categories.map(c=>`<option ${c===v?'selected':''}>${esc(c)}</option>`).join('')}</select>`}function guessCategory(name){let entries=[['野菜',/玉ねぎ|にんじん|キャベツ|レタス|きゅうり|じゃがいも|小松菜|ブロッコリー|ねぎ/],['果物',/りんご|バナナ|みかん|ぶどう/],['乳製品・卵',/牛乳|チーズ|ヨーグルト|卵|たまご|豆腐/],['パン・麺・米',/パン|うどん|そば|パスタ|米/],['肉・魚',/肉|鮭|サバ|さば|魚|鶏|豚/],['調味料',/醤油|しょうゆ|砂糖|塩|味噌|みそ|マヨ|酢/],['日用品',/洗剤|ティッシュ|トイレット|ラップ/],['冷凍食品',/冷凍|コロッケ|餃子/]];return entries.find(([c,re])=>state.categories.includes(c)&&re.test(name))?.[0]||'その他'}function favoritesHTML(filter=''){let matches=Object.entries(state.history).filter(([name,h])=>h.fav&&name.includes(filter)).sort((a,b)=>b[1].count-a[1].count).slice(0,12);return matches.length?'<div class="field">★ お気に入り</div><div class="pills">'+matches.map(([name])=>`<button class="pill" onclick="quickAdd('${encodeURIComponent(name)}')">★ ${esc(name)} ＋</button>`).join('')+'</div>':''}function suggestions(q){if(!q)return favoritesHTML();let matches=Object.entries(state.history).filter(([name])=>name.includes(q)).sort((a,b)=>(b[1].fav?1000:0)+b[1].count-((a[1].fav?1000:0)+a[1].count)).slice(0,7);return '<div class="pills">'+matches.map(([name])=>`<button class="pill" onclick="quickAdd('${encodeURIComponent(name)}')">${esc(name)} ＋</button>`).join('')+'</div>'}function openAdd(){currentEdit=null;openSheet(`<div class="row" style="justify-content:space-between"><h2>商品を追加</h2><button class="secondary" onclick="closeSheet()">閉じる</button></div><label class="field">商品名（複数なら「、」で区切る）</label><input id="itemName" class="fieldinput" placeholder="例：牛乳、卵、パン" oninput="updateSuggestions()"><div id="suggestions">${favoritesHTML()}</div><label class="field">数量（単位なし）</label><select id="itemQty" class="fieldinput">${Array.from({length:99},(_,i)=>`<option>${i+1}</option>`).join('')}</select><label class="field">カテゴリー</label>${categorySelect('その他')}<div class="tiny">商品名から自動で推測。必要なら変更してね。</div><label class="field">お店（複数選択可）</label><div class="checkrow">${storeChecks(state.lastStore==='all'?[]:[state.lastStore])}</div><div class="row" style="margin-top:18px"><button class="primary" style="flex:1" onclick="addFromForm()">追加する</button></div>`);$('itemName').focus()}function updateSuggestions(){let name=$('itemName').value.trim();$('suggestions').innerHTML=suggestions(name);if(name&&!name.includes('、'))$('itemCategory').value=state.history[name]?.category||guessCategory(name)}function quickAdd(encoded){let name=decodeURIComponent(encoded);addProducts([name],1,state.history[name]?.category||guessCategory(name),state.lastStore==='all'?[]:[state.lastStore]);$('itemName').value='';updateSuggestions();toast(name+' を追加したよ')}function addProducts(names,qty,category,stores){for(let name of names){name=name.trim();if(!name)continue;let existing=state.items.find(i=>i.name===name&&!i.done);if(existing&&confirm(`「${name}」は登録済みです。数量を合計しますか？`)){existing.qty+=qty;continue}state.items.push({id:uid(),name,qty,category:state.history[name]?.category||((names.length===1)?category:guessCategory(name)),stores:[...stores],done:false});state.history[name]??={count:0,fav:false};state.history[name].count++;state.history[name].category=state.items.at(-1).category}save()}function addFromForm(){let names=$('itemName').value.split(/[、,\n]+/).map(s=>s.trim()).filter(Boolean);if(!names.length){toast('商品名を入力してね');return}addProducts(names,Number($('itemQty').value),$('itemCategory').value,getSelectedStores());$('itemName').value='';$('itemQty').value='1';updateSuggestions();toast(names.length+'商品を追加したよ');$('itemName').focus()}function openEdit(id){let i=state.items.find(x=>x.id===id);if(!i)return;currentEdit=id;openSheet(`<div class="row" style="justify-content:space-between"><h2>商品を編集</h2><button class="secondary" onclick="closeSheet()">閉じる</button></div><label class="field">商品名</label><input id="itemName" class="fieldinput" value="${esc(i.name)}"><label class="field">数量</label><select id="itemQty" class="fieldinput">${Array.from({length:99},(_,n)=>`<option ${i.qty===n+1?'selected':''}>${n+1}</option>`).join('')}</select><label class="field">カテゴリー</label>${categorySelect(i.category)}<label class="field">お店</label><div class="checkrow">${storeChecks(i.stores)}</div><button class="primary" style="width:100%;margin-top:20px" onclick="saveEdit()">保存する</button>`)}function saveEdit(){let i=state.items.find(x=>x.id===currentEdit),name=$('itemName').value.trim();if(!i||!name)return;let old=i.name;i.name=name;i.qty=Number($('itemQty').value);i.category=$('itemCategory').value;i.stores=getSelectedStores();state.history[name]??={count:0,fav:state.history[old]?.fav||false};state.history[name].category=i.category;save();closeSheet()}function openStores(){openSheet(`<div class="row" style="justify-content:space-between"><h2>お店の管理</h2><button class="secondary" onclick="closeSheet()">閉じる</button></div><div id="storeList">${storeListHTML()}</div><label class="field">新しいお店</label><div class="row"><input id="newStore" class="fieldinput" placeholder="例：イオン"><button class="primary" onclick="addStore()">追加</button></div><div class="tiny" style="margin-top:12px">お店ごとのカテゴリー順は「設定」から変更できるよ。</div>`)}function storeListHTML(){return state.stores.map(s=>`<div class="settingline"><span>${esc(s.name)}</span><div class="row"><button class="secondary" onclick="renameStore('${s.id}')">名前変更</button><button class="secondary" onclick="removeStore('${s.id}')">削除</button></div></div>`).join('')||'<p class="tiny">まだお店が登録されていません。</p>'}function addStore(){let name=$('newStore').value.trim();if(!name)return;state.stores.push({id:uid(),name});save();$('storeList').innerHTML=storeListHTML();$('newStore').value=''}function renameStore(id){let s=state.stores.find(s=>s.id===id),name=prompt('お店の名前',s.name);if(name?.trim()){s.name=name.trim();save();$('storeList').innerHTML=storeListHTML()}}function removeStore(id){if(!confirm('このお店を削除しますか？ 商品自体は残ります。'))return;state.stores=state.stores.filter(s=>s.id!==id);state.items.forEach(i=>i.stores=i.stores.filter(x=>x!==id));delete state.orders[id];save();$('storeList').innerHTML=storeListHTML()}function openSettings(){openSheet(`<div class="row" style="justify-content:space-between"><h2>設定</h2><button class="secondary" onclick="closeSheet()">閉じる</button></div><label class="field">デザインテーマ</label><select class="fieldinput" onchange="state.theme=this.value;save()">${['シンプル','かわいいパステル','モダン','カラフル'].map((n,i)=>`<option value="${i+1}" ${state.theme==i+1?'selected':''}>${n}</option>`).join('')}</select><label class="field">文字サイズ</label><input type="range" min="14" max="22" value="${state.font}" oninput="state.font=Number(this.value);save()"><div class="settingline"><strong>カテゴリー</strong><button class="secondary" onclick="manageCats()">追加・編集</button></div><div class="settingline"><strong>カテゴリーの並び順</strong><button class="secondary" onclick="manageOrder()">変更する</button></div><p class="tiny">データはこのブラウザ内に保存します。Safariのデータ削除や端末変更では消える可能性があります。バックアップ機能はありません。</p>`)}function manageCats(){openSheet(`<div class="row" style="justify-content:space-between"><h2>カテゴリー管理</h2><button class="secondary" onclick="openSettings()">戻る</button></div><div id="catsList">${catListHTML()}</div><div class="row"><input class="fieldinput" id="newCat" placeholder="カテゴリー名"><button class="primary" onclick="addCat()">追加</button></div>`)}function catListHTML(){return state.categories.map(c=>`<div class="settingline"><span>${esc(c)}</span><div class="row"><button class="secondary" onclick="renameCat('${encodeURIComponent(c)}')">編集</button><button class="secondary" onclick="removeCat('${encodeURIComponent(c)}')">削除</button></div></div>`).join('')}function addCat(){let c=$('newCat').value.trim();if(c&&!state.categories.includes(c)){state.categories.push(c);save();$('catsList').innerHTML=catListHTML();$('newCat').value=''}}function renameCat(e){let c=decodeURIComponent(e),n=prompt('カテゴリー名',c)?.trim();if(!n||state.categories.includes(n))return;state.categories=state.categories.map(x=>x===c?n:x);state.items.forEach(i=>{if(i.category===c)i.category=n});Object.values(state.history).forEach(h=>{if(h.category===c)h.category=n});Object.keys(state.orders).forEach(k=>state.orders[k]=state.orders[k].map(x=>x===c?n:x));save();$('catsList').innerHTML=catListHTML()}function removeCat(e){let c=decodeURIComponent(e);if(c==='その他'){toast('「その他」は削除できません');return}if(!confirm(`「${c}」を削除しますか？ 商品は「その他」に移動します。`))return;state.categories=state.categories.filter(x=>x!==c);state.items.forEach(i=>{if(i.category===c)i.category='その他'});save();$('catsList').innerHTML=catListHTML()}function manageOrder(){let cats=orderedCats();openSheet(`<div class="row" style="justify-content:space-between"><h2>カテゴリーの並び順</h2><button class="secondary" onclick="openSettings()">戻る</button></div><p class="tiny">現在の表示先：${state.lastStore==='all'?'すべてのお店':esc(state.stores.find(s=>s.id===state.lastStore)?.name||'')}</p><div id="orderList"></div>`);drawOrder(cats)}function drawOrder(cats){$('orderList').innerHTML=cats.map((c,i)=>`<div class="settingline"><span>${esc(c)}</span><div class="row"><button class="secondary" ${i===0?'disabled':''} onclick="moveCat(${i},-1)">↑</button><button class="secondary" ${i===cats.length-1?'disabled':''} onclick="moveCat(${i},1)">↓</button></div></div>`).join('');window.currentOrder=cats}function moveCat(i,delta){let a=[...window.currentOrder];[a[i],a[i+delta]]=[a[i+delta],a[i]];state.orders[state.lastStore]=a;save();drawOrder(a)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
